<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Coordinator</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --text-dim: #8b8fa3;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --green: #00b894;
    --yellow: #fdcb6e;
    --red: #e17055;
    --blue: #74b9ff;
    --orange: #f39c12;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header h1 span { color: var(--accent-light); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .project-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; outline: none; }
  .project-select:focus { border-color: var(--accent); }
  .project-input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; width: 160px; outline: none; }
  .project-input:focus { border-color: var(--accent); }
  .refresh-info { font-size: 12px; color: var(--text-dim); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.ok { background: var(--green); }
  .status-dot.err { background: var(--red); }

  /* Stats bar */
  .stats-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 16px 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .stat-card .value.accent { color: var(--accent-light); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.blue { color: var(--blue); }
  .stat-card .value.yellow { color: var(--yellow); }
  .stat-card .value.orange { color: var(--orange); }

  /* Tabs */
  .tabs { display: flex; gap: 0; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .tab { padding: 12px 20px; font-size: 13px; font-weight: 500; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent-light); border-bottom-color: var(--accent); }

  /* Content */
  .content { padding: 20px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); padding: 8px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tr:hover { background: rgba(108,92,231,0.05); }

  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-pending { background: rgba(139,143,163,0.2); color: var(--text-dim); }
  .badge-ready { background: rgba(116,185,255,0.2); color: var(--blue); }
  .badge-in_progress { background: rgba(253,203,110,0.2); color: var(--yellow); }
  .badge-done { background: rgba(0,184,148,0.2); color: var(--green); }
  .badge-failed, .badge-blocked { background: rgba(225,112,85,0.2); color: var(--red); }
  .badge-online { background: rgba(0,184,148,0.2); color: var(--green); }
  .badge-offline { background: rgba(139,143,163,0.2); color: var(--text-dim); }
  .badge-draft { background: rgba(139,143,163,0.2); color: var(--text-dim); }
  .badge-proposed { background: rgba(116,185,255,0.2); color: var(--blue); }
  .badge-agreed { background: rgba(0,184,148,0.2); color: var(--green); }
  .badge-implemented { background: rgba(108,92,231,0.2); color: var(--accent-light); }
  .badge-deprecated { background: rgba(225,112,85,0.2); color: var(--red); }
  .badge-critical { background: rgba(225,112,85,0.2); color: var(--red); }
  .badge-high { background: rgba(243,156,18,0.2); color: var(--orange); }
  .badge-medium { background: rgba(116,185,255,0.2); color: var(--blue); }
  .badge-low { background: rgba(139,143,163,0.2); color: var(--text-dim); }

  /* Category badges */
  .badge-decision { background: rgba(108,92,231,0.2); color: var(--accent-light); }
  .badge-convention { background: rgba(0,184,148,0.2); color: var(--green); }
  .badge-architecture { background: rgba(116,185,255,0.2); color: var(--blue); }
  .badge-lesson { background: rgba(253,203,110,0.2); color: var(--yellow); }
  .badge-note { background: rgba(139,143,163,0.2); color: var(--text-dim); }

  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--text-dim); }
  .truncate { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--text-dim); }

  /* Events */
  .event-item { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; font-size: 13px; }
  .event-item:hover { background: rgba(108,92,231,0.05); }
  .event-seq { font-family: monospace; color: var(--text-dim); font-size: 11px; min-width: 40px; }
  .event-type { font-weight: 600; color: var(--accent-light); min-width: 160px; }
  .event-source { color: var(--blue); min-width: 80px; }
  .event-time { color: var(--text-dim); font-size: 11px; margin-left: auto; white-space: nowrap; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* Graph */
  .graph-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; min-height: 300px; }
  .graph-node { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; margin: 4px; font-size: 12px; }
  .graph-edge { color: var(--text-dim); font-size: 12px; padding: 2px 8px; }

  /* Responsive */
  @media (max-width: 768px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    <span>AI Agent Coordinator</span>
  </h1>
  <div class="header-right">
    <div>
      <label style="font-size:12px;color:var(--text-dim);margin-right:4px;">Project:</label>
      <input class="project-input" id="projectInput" value="default" placeholder="project namespace">
    </div>
    <span class="refresh-info" id="refreshInfo">--</span>
    <span class="status-dot" id="statusDot"></span>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="label">Agents</div><div class="value accent" id="statAgents">-</div></div>
  <div class="stat-card"><div class="label">Tasks</div><div class="value blue" id="statTasks">-</div></div>
  <div class="stat-card"><div class="label">Contracts</div><div class="value green" id="statContracts">-</div></div>
  <div class="stat-card"><div class="label">Memories</div><div class="value yellow" id="statMemories">-</div></div>
  <div class="stat-card"><div class="label">Events</div><div class="value orange" id="statEvents">-</div></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="agents">Agents</div>
  <div class="tab" data-tab="tasks">Tasks</div>
  <div class="tab" data-tab="contracts">Contracts</div>
  <div class="tab" data-tab="memories">Memories</div>
  <div class="tab" data-tab="events">Events</div>
  <div class="tab" data-tab="graph">Task Graph</div>
</div>

<div class="content">
  <!-- Agents -->
  <div class="panel active" id="panel-agents"></div>
  <!-- Tasks -->
  <div class="panel" id="panel-tasks"></div>
  <!-- Contracts -->
  <div class="panel" id="panel-contracts"></div>
  <!-- Memories -->
  <div class="panel" id="panel-memories"></div>
  <!-- Events -->
  <div class="panel" id="panel-events"></div>
  <!-- Graph -->
  <div class="panel" id="panel-graph"></div>
</div>

<script>
const API = '/api';
let currentProject = 'default';
let refreshTimer = null;

// --- Init ---
document.getElementById('projectInput').addEventListener('change', (e) => {
  currentProject = e.target.value.trim() || 'default';
  refreshAll();
});
document.getElementById('projectInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { currentProject = e.target.value.trim() || 'default'; refreshAll(); }
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

function badge(text, prefix) {
  prefix = prefix || text;
  return `<span class="badge badge-${prefix}">${text}</span>`;
}

function timeAgo(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const now = Date.now();
  const diff = Math.floor((now - d.getTime()) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return d.toLocaleDateString();
}

function shortId(id) {
  if (!id) return '-';
  return id.substring(0, 8);
}

// --- Fetch helpers ---
async function api(path) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(API + path + sep + 'project=' + encodeURIComponent(currentProject));
  if (!res.ok) throw new Error(res.statusText);
  return res.json();
}

// --- Render functions ---
function renderAgents(agents) {
  const el = document.getElementById('panel-agents');
  if (!agents.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">🤖</div>No agents registered yet</div>'; return; }
  el.innerHTML = `<table>
    <tr><th>Role</th><th>Instance ID</th><th>Status</th><th>Last Seen</th><th>Metadata</th></tr>
    ${agents.map(a => `<tr>
      <td><strong>${a.role}</strong></td>
      <td class="mono">${shortId(a.instanceId)}</td>
      <td>${badge(a.status)}</td>
      <td>${timeAgo(a.lastSeen)}</td>
      <td class="mono truncate">${JSON.stringify(a.metadata||{})}</td>
    </tr>`).join('')}
  </table>`;
}

function renderTasks(tasks) {
  const el = document.getElementById('panel-tasks');
  if (!tasks.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>No tasks yet</div>'; return; }
  el.innerHTML = `<table>
    <tr><th>Title</th><th>Assignee</th><th>Status</th><th>Priority</th><th>Deps</th><th>Created</th><th>ID</th></tr>
    ${tasks.map(t => `<tr>
      <td><strong>${t.title}</strong>${t.description ? '<br><span style="color:var(--text-dim);font-size:12px">' + t.description.substring(0,80) + '</span>' : ''}</td>
      <td>${t.assignee}</td>
      <td>${badge(t.status)}</td>
      <td>${badge(t.priority)}</td>
      <td>${t.dependencies.length ? t.dependencies.map(d => '<span class="mono">' + shortId(d) + '</span>').join(', ') : '-'}</td>
      <td>${timeAgo(t.createdAt)}</td>
      <td class="mono">${shortId(t.id)}</td>
    </tr>`).join('')}
  </table>`;
}

function renderContracts(contracts) {
  const el = document.getElementById('panel-contracts');
  if (!contracts.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📄</div>No contracts yet</div>'; return; }
  el.innerHTML = `<table>
    <tr><th>Name</th><th>Type</th><th>Status</th><th>Producer</th><th>Consumers</th><th>Version</th><th>ID</th></tr>
    ${contracts.map(c => `<tr>
      <td><strong>${c.name}</strong></td>
      <td>${badge(c.type)}</td>
      <td>${badge(c.status)}</td>
      <td>${c.producer}</td>
      <td>${(c.consumers||[]).join(', ') || '-'}</td>
      <td>v${c.version}</td>
      <td class="mono">${shortId(c.id)}</td>
    </tr>`).join('')}
  </table>`;
}

function renderMemories(memories) {
  const el = document.getElementById('panel-memories');
  if (!memories.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">🧠</div>No memories stored yet</div>'; return; }
  el.innerHTML = `<table>
    <tr><th>Title</th><th>Category</th><th>Scope</th><th>Created By</th><th>Tags</th><th>Updated</th></tr>
    ${memories.map(m => `<tr>
      <td><strong>${m.title}</strong><br><span style="color:var(--text-dim);font-size:12px">${(m.content||'').substring(0,100)}</span></td>
      <td>${badge(m.category)}</td>
      <td>${m.scope}</td>
      <td>${m.createdBy}</td>
      <td><div class="tags">${(m.tags||[]).map(t => '<span class="tag">'+t+'</span>').join('')}</div></td>
      <td>${timeAgo(m.updatedAt)}</td>
    </tr>`).join('')}
  </table>`;
}

function renderEvents(data) {
  const el = document.getElementById('panel-events');
  const events = data.events || [];
  if (!events.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📡</div>No events yet</div>'; return; }
  el.innerHTML = events.slice().reverse().map(e => `
    <div class="event-item">
      <span class="event-seq">#${e.seq}</span>
      <span class="event-type">${e.type}</span>
      <span class="event-source">${e.source}</span>
      <span class="mono truncate" style="flex:1">${JSON.stringify(e.payload)}</span>
      <span class="event-time">${timeAgo(e.timestamp)}</span>
    </div>
  `).join('');
}

function renderGraph(graph) {
  const el = document.getElementById('panel-graph');
  const nodes = graph.nodes || [];
  const edges = graph.edges || [];
  if (!nodes.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">🔗</div>No task graph yet</div>'; return; }

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  // Simple layered layout
  const layers = [];
  const placed = new Set();
  const deps = new Map();
  nodes.forEach(n => deps.set(n.id, new Set(n.dependencies)));

  while (placed.size < nodes.length) {
    const layer = nodes.filter(n => !placed.has(n.id) && [...deps.get(n.id)].every(d => placed.has(d)));
    if (!layer.length) { nodes.filter(n => !placed.has(n.id)).forEach(n => layer.push(n)); }
    layers.push(layer);
    layer.forEach(n => placed.add(n.id));
  }

  let html = '<div class="graph-container">';
  layers.forEach((layer, i) => {
    html += `<div style="margin-bottom:12px;${i>0?'padding-left:'+(i*24)+'px':''}">`;
    layer.forEach(n => {
      const color = n.status === 'done' ? 'var(--green)' : n.status === 'in_progress' ? 'var(--yellow)' : n.status === 'ready' ? 'var(--blue)' : n.status === 'failed' ? 'var(--red)' : 'var(--text-dim)';
      html += `<div class="graph-node" style="border-color:${color}">
        <span style="color:${color}">●</span>
        <span>${n.title}</span>
        <span style="color:var(--text-dim);font-size:11px">(${n.assignee})</span>
      </div>`;
    });
    html += '</div>';
    if (i < layers.length - 1) {
      html += `<div style="padding-left:${i*24+20}px;color:var(--text-dim)">↓</div>`;
    }
  });
  html += '</div>';
  el.innerHTML = html;
}

// --- Refresh ---
async function refreshAll() {
  try {
    const [agents, tasks, contracts, memories, events, graph] = await Promise.all([
      api('/agents'),
      api('/tasks'),
      api('/contracts'),
      api('/memories'),
      api('/events'),
      api('/tasks/graph'),
    ]);

    document.getElementById('statAgents').textContent = agents.length;
    document.getElementById('statTasks').textContent = tasks.length;
    document.getElementById('statContracts').textContent = contracts.length;
    document.getElementById('statMemories').textContent = memories.length;
    document.getElementById('statEvents').textContent = (events.total || 0);

    renderAgents(agents);
    renderTasks(tasks);
    renderContracts(contracts);
    renderMemories(memories);
    renderEvents(events);
    renderGraph(graph);

    document.getElementById('statusDot').className = 'status-dot ok';
    document.getElementById('refreshInfo').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('statusDot').className = 'status-dot err';
    document.getElementById('refreshInfo').textContent = 'Error: ' + err.message;
  }
}

// Auto refresh every 5s
refreshAll();
refreshTimer = setInterval(refreshAll, 5000);
</script>
</body>
</html>
